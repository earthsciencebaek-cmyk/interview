<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>면접 대비반 교사용 대시보드</title>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); background-attachment: fixed; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; color: #2c3e50; }
        .glass-panel { background: rgba(255, 255, 255, 0.35); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 20px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15); }
        .top-nav { display: flex; align-items: center; padding: 15px 25px; gap: 15px; flex-wrap: wrap; }
        .top-nav h2 { margin: 0; padding-right: 20px; border-right: 2px solid rgba(255, 255, 255, 0.5); font-size: 22px; text-shadow: 1px 1px 2px rgba(255,255,255,0.8); }
        .tab-btn { background: rgba(255, 255, 255, 0.4); border: 1px solid rgba(255, 255, 255, 0.6); padding: 10px 20px; border-radius: 12px; font-size: 15px; font-weight: bold; color: #34495e; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; }
        .tab-btn:hover { background: rgba(255, 255, 255, 0.6); transform: translateY(-2px); }
        .tab-btn.active { background: linear-gradient(135deg, rgba(102, 126, 234, 0.8), rgba(118, 75, 162, 0.8)); color: white; border: none; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); }
        .ml-auto { margin-left: auto; }
        .main-content { flex-grow: 1; padding: 30px; display: flex; flex-direction: column; overflow: hidden; }
        .tab-content { display: none; height: 100%; flex-direction: column; }
        .tab-content.active { display: flex; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .title-container { display: flex; align-items: center; gap: 10px; }
        .filter-group { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .filter-group select { padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.6); background: rgba(255,255,255,0.5); font-weight: bold; outline: none; height: 40px; }
        .filter-pills { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-pill { padding: 8px 14px; background: rgba(255, 255, 255, 0.4); border: 1px solid rgba(255, 255, 255, 0.7); border-radius: 20px; font-size: 13px; font-weight: bold; color: #2c3e50; cursor: pointer; transition: all 0.2s ease; }
        .filter-pill:hover { background: rgba(255, 255, 255, 0.7); }
        .filter-pill.active { background: #667eea; color: white; border-color: #667eea; box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4); }
        
        .search-input { padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.6); background: rgba(255,255,255,0.5); font-weight: bold; outline: none; height: 40px; box-sizing: border-box; transition: all 0.2s; }
        .search-input:focus { background: rgba(255,255,255,0.8); border-color: #667eea; }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; overflow-y: auto; padding-top: 15px; padding-bottom: 25px; padding-right: 10px; padding-left: 5px; }
        .card { background: rgba(255, 255, 255, 0.45); border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 16px; padding: 20px; cursor: pointer; transition: all 0.3s ease; position: relative; }
        .card:hover { transform: translateY(-8px); background: rgba(255, 255, 255, 0.75); box-shadow: 0 12px 24px rgba(0,0,0,0.15); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px dashed rgba(0,0,0,0.2); padding-bottom: 10px; }
        .card-name { font-size: 20px; font-weight: 900; }
        .card-id { background: rgba(102, 126, 234, 0.2); padding: 4px 8px; border-radius: 8px; font-size: 12px; font-weight: bold; }
        .card-tag { display: inline-block; background: rgba(255, 154, 158, 0.3); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
        .card-target { font-size: 15px; font-weight: bold; color: #2c3e50; margin-bottom: 5px; }
        .table-container { overflow: auto; background: rgba(255, 255, 255, 0.4); border-radius: 15px; padding: 10px; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.5); }
        th { background: rgba(255, 255, 255, 0.5); font-weight: bold; position: sticky; top: 0; backdrop-filter: blur(5px); z-index: 10; }
        tbody tr:hover { background: rgba(255, 255, 255, 0.6); }
        
        .delete-btn { background-color: #ff7675; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        .delete-btn:hover { background-color: #d63031; }
        .reg-btn { background-color: #3498db; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        .reg-btn:hover { background-color: #2980b9; }
        .edit-btn { background-color: #2ecc71; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        .edit-btn:hover { background-color: #27ae60; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 100; overflow-y: auto; padding: 20px; }
        .modal-content { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); border-radius: 20px; padding: 30px; width: 100%; max-width: 550px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); position: relative; margin: auto; }
        .close-btn { position: absolute; top: 20px; right: 20px; background: rgba(255,0,0,0.1); border: none; border-radius: 50%; width: 30px; height: 30px; font-weight: bold; color: #d63031; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .modal-item { margin-bottom: 15px; }
        .modal-item span { display: block; font-size: 12px; color: #7f8c8d; font-weight: bold; margin-bottom: 4px; }
        .modal-item div { font-size: 15px; font-weight: 500; background: rgba(255,255,255,0.6); padding: 10px; border-radius: 8px; }
        .loading { text-align: center; font-size: 18px; font-weight: bold; padding: 50px; display: none; }

        /* 수시지원 현황 렌더링 스타일 */
        .card-list-box { background: rgba(255, 255, 255, 0.7); border-radius: 8px; padding: 15px; margin-top: 5px; }
        .card-row { display: flex; border-bottom: 1px dashed #ccc; padding: 8px 0; align-items: center; }
        .card-row:last-child { border-bottom: none; }
        .card-num { font-weight: bold; color: #667eea; width: 35px; flex-shrink: 0; }
        .card-info { flex-grow: 1; font-size: 14px; font-weight: 500; }
        
        /* ★ 수정됨: 수시지원 입력 폼 스타일 (칸 튀어나감 방지 완벽 적용) */
        .edit-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; width: 100%; box-sizing: border-box; }
        .edit-row span { font-weight: bold; color: #2c3e50; font-size: 14px; width: 35px; text-align: center; flex-shrink: 0; }
        .edit-row input { 
            flex: 1; 
            min-width: 0; /* flex 자식 요소가 부모 너비를 넘지 못하게 강제 */
            width: 100%;
            padding: 8px; 
            border: 1px solid rgba(0,0,0,0.2); 
            border-radius: 6px; 
            background: rgba(255,255,255,0.8); 
            font-size: 13px; 
            box-sizing: border-box;
        }
        
        /* ★ 추가됨: 플러스 추가 버튼 스타일 */
        .add-row-btn {
            width: 100%; 
            padding: 12px; 
            margin-top: 5px;
            background: rgba(102, 126, 234, 0.15); 
            border: 2px dashed #667eea;
            color: #667eea; 
            font-size: 14px;
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer;
            transition: background 0.3s;
        }
        .add-row-btn:hover { background: rgba(102, 126, 234, 0.3); }

        .save-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, rgba(102, 126, 234, 0.9), rgba(118, 75, 162, 0.9)); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; margin-top: 15px; cursor: pointer; }

        @media screen and (max-width: 768px) { .top-nav { justify-content: center; padding: 15px; } .top-nav h2 { width: 100%; text-align: center; border-right: none; padding-right: 0; margin-bottom: 10px; } .ml-auto { margin-left: 0; width: 100%; justify-content: center; } .tab-btn { flex: 1; justify-content: center; } .main-content { padding: 15px; } }
    </style>
</head>
<body>
    <div class="top-nav glass-panel">
        <h2>🎯 면접 대비반 관리</h2>
        <button class="tab-btn active" onclick="switchTab('gallery')">📇 참여 학생 정보 카드</button>
        <button class="tab-btn" onclick="switchTab('table')">📊 전체 데이터 표</button>
        <button class="tab-btn ml-auto" onclick="fetchData()" style="background: rgba(255,255,255,0.2); border: 1px dashed #333;">🔄 서버 동기화</button>
    </div>
    
    <div class="main-content glass-panel">
        <div class="header-section">
            <div class="title-container">
                <h3 id="currentTabTitle" style="margin: 0; font-size: 22px;">면접 대비반 참여 학생 정보 카드</h3>
                <h3 id="studentCount" style="margin: 0; font-size: 22px; color: #e15f41;">(총 0명)</h3>
            </div>
            <div class="filter-group">
                <select id="filterDate" onchange="renderAll()">
                    <option value="all">🗓️ 모든 날짜</option>
                    <option value="10월 19일(월)">10월 19일(월)</option>
                    <option value="11월 25일(화)">11월 25일(화)</option>
                </select>
                <select id="filterClass" onchange="renderAll()">
                    <option value="all">🏫 모든 학급</option>
                </select>
                <button class="filter-pill" id="sortBtn" onclick="toggleSort()" style="background: rgba(46, 204, 113, 0.2); border-color: #2ecc71;">🔃 학번 정렬</button>
                <button class="filter-pill" onclick="resetFilters()" style="background: rgba(231, 76, 60, 0.2); border-color: #e74c3c;">🔄 필터 초기화</button>
                
                <div class="filter-pills" id="trackFilters" style="border-left: 2px solid rgba(0,0,0,0.1); padding-left: 10px;">
                    <button class="filter-pill active" onclick="toggleTrack(this, 'all')">전체</button>
                    <button class="filter-pill" onclick="toggleTrack(this, '자연')">자연</button>
                    <button class="filter-pill" onclick="toggleTrack(this, '인문')">인문</button>
                    <button class="filter-pill" onclick="toggleTrack(this, '교대+사범대')">사범</button>
                    <button class="filter-pill" onclick="toggleTrack(this, '의약학')">의약학</button>
                    <button class="filter-pill" onclick="toggleTrack(this, '예체')">예체능</button>
                </div>

                <div style="border-left: 2px solid rgba(0,0,0,0.1); padding-left: 10px; display: flex; align-items: center;">
                    <input type="text" id="searchName" class="search-input" placeholder="🔍 학생 이름 검색" onkeyup="renderAll()">
                </div>
            </div>
        </div>
        <div id="loading" class="loading">데이터를 불러오는 중입니다... ⏳</div>
        <div id="gallery-tab" class="tab-content active">
            <div class="gallery-grid" id="galleryContainer"></div>
        </div>
        <div id="table-tab" class="tab-content">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>희망 날짜</th>
                            <th>학번</th>
                            <th>이름</th>
                            <th>계열</th>
                            <th>목표 대학/전형/학과</th>
                            <th>1차 합격 여부</th>
                            <th>실제 면접일</th>
                            <!-- ★ 수정됨: 수시 지원 카드 제목 가운데 정렬 -->
                            <th style="text-align: center;">수시 지원 카드</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 1. 기존 학생 정보 상세 모달 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('detailModal')">X</button>
            <h2 id="m-name" style="margin-top:0; border-bottom: 2px solid #eee; padding-bottom: 10px;">이름</h2>
            <div class="modal-item"><span>학번 / 전화번호</span><div id="m-info"></div></div>
            <div class="modal-item"><span>모의면접 희망 날짜</span><div id="m-date"></div></div>
            <div class="modal-item"><span>연습 목표 전형 정보</span><div id="m-target"></div></div>
            <div class="modal-item"><span>1차 합격 여부 / 1차 발표일 / 실제 면접일</span><div id="m-schedule"></div></div>
            <div class="modal-item"><span>💬 솔직한 고민</span><div id="m-concern" style="background: rgba(255,234,167,0.4); min-height: 60px;"></div></div>
            <div class="modal-item" style="margin-top: 20px;">
                <span>📋 수시지원 카드 현황 (전체)</span>
                <div id="m-cards" class="card-list-box"></div>
            </div>
        </div>
    </div>

    <!-- 2. 신규: 수시 지원 카드 등록/수정 전용 모달 -->
    <div class="modal-overlay" id="cardEditModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('cardEditModal')">X</button>
            <h2 style="margin-top:0; border-bottom: 2px solid #eee; padding-bottom: 10px;">📋 수시지원 카드 등록</h2>
            <p id="cardEditTargetName" style="font-weight: bold; color: #667eea; margin-bottom: 15px;"></p>
            
            <div id="cardInputContainer">
                <!-- 자바스크립트로 최대 6개 입력칸 생성 및 표시 제어 -->
            </div>
            
            <!-- ★ 추가됨: 순차적으로 칸을 늘리는 플러스 버튼 -->
            <button id="addCardRowBtn" class="add-row-btn" type="button" onclick="addCardRow()">➕ 대학 추가하기</button>
            
            <button class="save-btn" onclick="saveCards()">저장하기</button>
        </div>
    </div>

    <script>
        // ★★★ 여기에 구글 시트에서 복사한 웹앱 URL을 붙여넣으세요! ★★★
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyRF9Rdsh-IaYRj6otA2fJ6poM9LxmuCBnwjXAepWs-ATuUslBiOBWiYK3Al2kx0T4/exec';
        
        let globalData = []; 
        let selectedTracks = new Set(['all']);
        let isSortedAsc = false;
        let editingStudent = null; 

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId + '-tab').classList.add('active');
            event.currentTarget.classList.add('active');
            document.getElementById('currentTabTitle').innerText = tabId === 'gallery' ? '면접 대비반 참여 학생 정보 카드' : '전체 수합 데이터';
        }

        function toggleTrack(btnElement, trackVal) {
            if (trackVal === 'all') {
                selectedTracks.clear(); selectedTracks.add('all');
                document.querySelectorAll('#trackFilters .filter-pill').forEach(p => p.classList.remove('active'));
                btnElement.classList.add('active');
            } else {
                selectedTracks.delete('all');
                document.querySelector('#trackFilters .filter-pill[onclick*="all"]').classList.remove('active');
                if (selectedTracks.has(trackVal)) { selectedTracks.delete(trackVal); btnElement.classList.remove('active'); } 
                else { selectedTracks.add(trackVal); btnElement.classList.add('active'); }
                if (selectedTracks.size === 0) { selectedTracks.add('all'); document.querySelector('#trackFilters .filter-pill[onclick*="all"]').classList.add('active'); }
            }
            renderAll();
        }

        function resetFilters() {
            document.getElementById('filterDate').value = 'all';
            document.getElementById('filterClass').value = 'all';
            document.getElementById('searchName').value = ''; 
            toggleTrack(document.querySelector('#trackFilters .filter-pill[onclick*="all"]'), 'all');
        }

        function toggleSort() {
            isSortedAsc = !isSortedAsc;
            const sortBtn = document.getElementById('sortBtn');
            if(isSortedAsc) { sortBtn.innerText = '🔽 학번순 (켜짐)'; sortBtn.style.background = '#2ecc71'; sortBtn.style.color = 'white'; } 
            else { sortBtn.innerText = '🔃 학번 정렬'; sortBtn.style.background = 'rgba(46, 204, 113, 0.2)'; sortBtn.style.color = '#2c3e50'; }
            renderAll();
        }

        function populateClassFilter() {
            const classFilter = document.getElementById('filterClass');
            const classes = new Set();
            globalData.forEach(row => {
                const id = getFlexibleValue(row, '학번', '');
                if (id && id.toString().length >= 3) classes.add(id.toString().substring(0, 3));
            });
            const sortedClasses = Array.from(classes).sort();
            classFilter.innerHTML = '<option value="all">🏫 모든 학급</option>';
            sortedClasses.forEach(cls => classFilter.innerHTML += `<option value="${cls}">${cls}반</option>`);
        }

        function fetchData() {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            fetch(WEB_APP_URL)
                .then(res => res.json())
                .then(data => { globalData = data; populateClassFilter(); loading.style.display = 'none'; renderAll(); })
                .catch(err => { console.error(err); loading.innerHTML = '데이터를 불러오는 데 실패했습니다.'; });
        }

        function getFlexibleValue(student, keyword, defaultVal = '') {
            const foundKey = Object.keys(student).find(k => k.includes(keyword));
            return foundKey ? student[foundKey] : defaultVal;
        }

        function getMethodValue(student) {
            const keys = Object.keys(student);
            let rawValue = '미입력';
            for (let k of keys) {
                if ((k.includes('진행') || k.includes('방식') || k.includes('여부')) && !k.includes('실제')) {
                    if (student[k] && student[k] !== '') { rawValue = student[k]; break; }
                }
            }
            if (rawValue === '미입력') return rawValue;
            if (rawValue.includes('발표 후')) return '1차 합격 후 면접 진행';
            if (rawValue.includes('상관없이') || rawValue.includes('없이 바로')) return '1차 합격 없이 바로 면접 진행';
            return rawValue; 
        }

        function formatToDateOnly(dateString) {
            if (!dateString || dateString === '해당없음' || dateString === '-' || dateString === '미입력') return dateString;
            if (dateString.toString().includes('T')) return dateString.toString().split('T')[0];
            return dateString;
        }

        function renderAll() {
            const dateFilter = document.getElementById('filterDate').value;
            const classFilter = document.getElementById('filterClass').value;
            const searchName = document.getElementById('searchName').value.trim(); 

            let filteredData = globalData.filter(row => {
                const d = getFlexibleValue(row, '날짜');
                const t = getFlexibleValue(row, '계열');
                const id = getFlexibleValue(row, '학번', '').toString();
                const name = getFlexibleValue(row, '이름', '').toString();

                let dateMatch = (dateFilter === 'all') || d.includes(dateFilter);
                let classMatch = (classFilter === 'all') || id.startsWith(classFilter);
                let nameMatch = name.includes(searchName); 

                let trackMatch = selectedTracks.has('all');
                if (!trackMatch) { for (let selected of selectedTracks) { if (t.includes(selected)) { trackMatch = true; break; } } }
                
                return dateMatch && classMatch && trackMatch && nameMatch;
            });
            
            if (isSortedAsc) {
                filteredData.sort((a, b) => {
                    return getFlexibleValue(a, '학번', '').toString().localeCompare(getFlexibleValue(b, '학번', '').toString());
                });
            }
            const countElement = document.getElementById('studentCount');
            if(countElement) countElement.innerText = `(총 ${filteredData.length}명)`;
            renderGallery(filteredData);
            renderTable(filteredData);
        }

        function renderGallery(data) {
            const container = document.getElementById('galleryContainer');
            container.innerHTML = '';
            if(data.length === 0) { container.innerHTML = '<div style="padding:20px;">조건에 맞는 학생이 없습니다.</div>'; return; }
            data.forEach((student) => {
                const name = getFlexibleValue(student, '이름', '이름없음');
                const id = getFlexibleValue(student, '학번', '-');
                const univ = getFlexibleValue(student, '대학');
                const type = getFlexibleValue(student, '전형');
                const dept = getFlexibleValue(student, '학과');
                const date = getFlexibleValue(student, '날짜');
                const track = getFlexibleValue(student, '계열');
                const shortTrack = track ? track.split('(')[0].trim() : '-';
                
                const cardsStr = getFlexibleValue(student, '수시지원', '');
                const hasCards = cardsStr && cardsStr.length > 5;
                const badge = hasCards ? ' <span style="font-size:10px; background:#2ecc71; color:white; padding:2px 5px; border-radius:10px;">카드등록됨</span>' : '';

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(student);
                card.innerHTML = `
                    <div class="card-header"><span class="card-name">${name}${badge}</span><span class="card-id">${id}</span></div>
                    <div class="card-tag">${shortTrack}</div>
                    <div class="card-target">🏫 ${univ} ${type}</div>
                    <div style="font-size: 13px; color: #555;">${dept}</div>
                    <div style="margin-top: 15px; font-size: 12px; font-weight: bold; color: #e15f41;">🗓️ ${date} 배정</div>`;
                container.appendChild(card);
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            data.forEach(student => {
                const track = getFlexibleValue(student, '계열');
                const shortTrack = track ? track.split('(')[0].trim() : '-';
                const method = getMethodValue(student);
                const actualDate = formatToDateOnly(getFlexibleValue(student, '실제 면접', '-'));
                
                const studentId = getFlexibleValue(student, '학번', '');
                const studentName = getFlexibleValue(student, '이름', '');
                const timestamp = getFlexibleValue(student, '타임스탬프', '');

                const cardsStr = getFlexibleValue(student, '수시지원', '');
                const hasCards = cardsStr && cardsStr.length > 5; 
                const btnText = hasCards ? '수정' : '등록';
                const btnClass = hasCards ? 'edit-btn' : 'reg-btn';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${getFlexibleValue(student, '날짜', '-')}</b></td>
                    <td>${studentId}</td>
                    <td><b>${studentName}</b></td>
                    <td>${shortTrack}</td>
                    <td>${getFlexibleValue(student, '대학')} / ${getFlexibleValue(student, '전형')} / ${getFlexibleValue(student, '학과')}</td>
                    <td>${method}</td>
                    <td>${actualDate}</td>
                    <!-- ★ 수정됨: 셀 중앙 정렬 적용 (등록 버튼) -->
                    <td style="text-align: center;"><button class="${btnClass}" onclick="openCardEditModal('${studentId}', '${studentName}', '${escapeQuotes(cardsStr)}')">${btnText}</button></td>
                    <td><button class="delete-btn" onclick="deleteData(this, '${studentId}', '${studentName}', '${timestamp}')">삭제</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function escapeQuotes(str) {
            return str ? str.replace(/'/g, "\\'").replace(/"/g, '&quot;') : '';
        }
        function unescapeQuotes(str) {
            return str ? str.replace(/&quot;/g, '"').replace(/\\'/g, "'") : '';
        }

        // ==========================================
        // ★ 수정됨: 수시지원 카드 모달 열기 및 세팅 (순차 오픈 로직 포함)
        // ==========================================
        function openCardEditModal(studentId, studentName, cardsStrEscaped) {
            editingStudent = { id: studentId, name: studentName };
            document.getElementById('cardEditTargetName').innerText = `[${studentId} ${studentName}] 학생`;
            
            const container = document.getElementById('cardInputContainer');
            container.innerHTML = '';
            
            let savedCards = Array(6).fill({univ: '', type: '', dept: ''});
            
            if (cardsStrEscaped && cardsStrEscaped.length > 5) {
                try {
                    const parsed = JSON.parse(unescapeQuotes(cardsStrEscaped));
                    if (Array.isArray(parsed)) {
                        for(let i=0; i<6; i++) {
                            if(parsed[i]) savedCards[i] = parsed[i];
                        }
                    }
                } catch(e) { console.error("카드 데이터 파싱 오류", e); }
            }

            // 6개 입력칸 생성 및 표시 여부 결정
            for (let i = 0; i < 6; i++) {
                // 저장된 데이터가 있거나, 첫 번째 칸(index 0)이면 노출 (display: flex)
                const hasData = savedCards[i].univ || savedCards[i].type || savedCards[i].dept;
                const displayStyle = (i === 0 || hasData) ? 'flex' : 'none';

                container.innerHTML += `
                    <div class="edit-row" id="cardRow_${i}" style="display: ${displayStyle};">
                        <!-- ★ 수정됨: '지망' 대신 '번' 사용 -->
                        <span>${i+1}번</span>
                        <input type="text" id="c_u_${i}" placeholder="대학명" value="${savedCards[i].univ}">
                        <input type="text" id="c_t_${i}" placeholder="전형명" value="${savedCards[i].type}">
                        <input type="text" id="c_d_${i}" placeholder="학과명" value="${savedCards[i].dept}">
                    </div>
                `;
            }
            
            checkAddButtonVisibility(); // 추가 버튼 숨김/표시 업데이트
            document.getElementById('cardEditModal').style.display = 'flex';
        }

        // ★ 추가됨: 플러스 버튼 클릭 시 다음 줄 표시 로직
        function addCardRow() {
            for (let i = 1; i < 6; i++) {
                const row = document.getElementById(`cardRow_${i}`);
                if (row.style.display === 'none') {
                    row.style.display = 'flex';
                    break; // 한 번에 한 줄씩만 추가
                }
            }
            checkAddButtonVisibility();
        }

        // ★ 추가됨: 모든 줄(6개)이 열려있으면 플러스 버튼 숨기기
        function checkAddButtonVisibility() {
            let allVisible = true;
            for (let i = 0; i < 6; i++) {
                if (document.getElementById(`cardRow_${i}`).style.display === 'none') {
                    allVisible = false;
                    break;
                }
            }
            document.getElementById('addCardRowBtn').style.display = allVisible ? 'none' : 'block';
        }

        async function saveCards() {
            if(!editingStudent) return;
            const btn = document.querySelector('#cardEditModal .save-btn');
            btn.innerHTML = '저장 중... ⏳';
            btn.disabled = true;

            const cards = [];
            for (let i = 0; i < 6; i++) {
                cards.push({
                    univ: document.getElementById(`c_u_${i}`).value.trim(),
                    type: document.getElementById(`c_t_${i}`).value.trim(),
                    dept: document.getElementById(`c_d_${i}`).value.trim()
                });
            }
            const cardsDataStr = JSON.stringify(cards);

            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ 
                        action: 'updateCards', 
                        studentId: editingStudent.id, 
                        studentName: editingStudent.name, 
                        cardsData: cardsDataStr 
                    })
                });
                
                const result = await res.json();
                if (result.result === 'success') {
                    const target = globalData.find(r => 
                        getFlexibleValue(r, '학번','').toString() === editingStudent.id && 
                        getFlexibleValue(r, '이름','').toString() === editingStudent.name
                    );
                    if (target) {
                        const cardKey = Object.keys(target).find(k => k.includes('수시지원'));
                        if (cardKey) target[cardKey] = cardsDataStr;
                        else target['수시지원'] = cardsDataStr; 
                    }
                    
                    renderAll();
                    alert('성공적으로 저장되었습니다!');
                    closeModal('cardEditModal');
                } else {
                    alert('저장에 실패했습니다.');
                }
            } catch (error) { 
                console.error('저장 오류:', error); 
                alert('통신 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
            }
            btn.innerHTML = '저장하기';
            btn.disabled = false;
        }

        async function deleteData(btn, studentId, studentName, timestamp) {
            if (!studentId && !studentName && !timestamp) { alert('삭제할 수 없습니다. (데이터 누락)'); return; }
            if (!confirm(`[${studentId} ${studentName}] 학생 데이터를 정말 삭제하시겠습니까?`)) return;

            const originalText = btn.innerHTML;
            btn.innerHTML = '삭제중..';
            btn.disabled = true;

            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'delete', studentId: studentId, studentName: studentName, timestamp: timestamp })
                });
                if (!res.ok) throw new Error('서버 통신 오류');
                const result = await res.json();
                
                if (result.result === 'success') {
                    const indexToRemove = globalData.findIndex(row => {
                        const id = getFlexibleValue(row, '학번', '').toString();
                        const name = getFlexibleValue(row, '이름', '').toString();
                        const time = getFlexibleValue(row, '타임스탬프', '').toString();
                        if (!studentId && !studentName) return time === (timestamp || '').toString();
                        return id === (studentId || '').toString() && name === (studentName || '').toString() && time === (timestamp || '').toString();
                    });
                    if (indexToRemove !== -1) globalData.splice(indexToRemove, 1);
                    renderAll(); 
                } else {
                    alert('삭제 실패: 새로고침(동기화)을 해주세요.');
                    btn.innerHTML = originalText; btn.disabled = false;
                }
            } catch (error) { 
                alert('통신 지연이 발생했습니다.'); fetchData(); 
            }
        }

        function openModal(student) {
            document.getElementById('m-name').innerText = getFlexibleValue(student, '학번', '') + ' ' + getFlexibleValue(student, '이름', '');
            document.getElementById('m-info').innerText = `📞 ${getFlexibleValue(student, '전화번호', '-')}`;
            document.getElementById('m-date').innerText = `📌 ${getFlexibleValue(student, '날짜', '-')}`;
            document.getElementById('m-target').innerText = `🏫 ${getFlexibleValue(student, '대학')} | ${getFlexibleValue(student, '전형')} | ${getFlexibleValue(student, '학과')}`;
            const method = getMethodValue(student);
            const passDate = formatToDateOnly(getFlexibleValue(student, '1차 합격', '해당없음'));
            const actualDate = formatToDateOnly(getFlexibleValue(student, '실제 면접', '-'));
            const concern = getFlexibleValue(student, '고민', '입력된 내용이 없습니다.');
            
            let scheduleText = `✅ 1차 합격 여부: <b>${method}</b><br>`;
            if(passDate && passDate !== '해당없음' && passDate !== '-' && passDate !== '미입력') { scheduleText += `🎯 1차 발표일: ${passDate}<br>`; }
            scheduleText += `🚨 실제 면접일: ${actualDate}`;
            document.getElementById('m-schedule').innerHTML = scheduleText;
            document.getElementById('m-concern').innerText = concern;

            const cardsBox = document.getElementById('m-cards');
            cardsBox.innerHTML = ''; 
            const cardsStr = getFlexibleValue(student, '수시지원', '');
            
            if (cardsStr && cardsStr.length > 5) {
                try {
                    const parsed = JSON.parse(cardsStr);
                    let hasAnyData = false;
                    parsed.forEach((card, idx) => {
                        if (card.univ || card.type || card.dept) {
                            hasAnyData = true;
                            cardsBox.innerHTML += `
                                <div class="card-row">
                                    <!-- ★ 수정됨: 모달 상세 뷰에서도 '지망' 대신 '번' 사용 -->
                                    <div class="card-num">${idx + 1}번</div>
                                    <div class="card-info">${card.univ || '-'} / ${card.type || '-'} / ${card.dept || '-'}</div>
                                </div>
                            `;
                        }
                    });
                    if(!hasAnyData) cardsBox.innerHTML = '<div style="color:#777; font-size:13px; text-align:center;">저장된 지원 정보가 없습니다.</div>';
                } catch(e) {
                    cardsBox.innerHTML = '<div style="color:#777; font-size:13px; text-align:center;">데이터를 읽을 수 없습니다.</div>';
                }
            } else {
                cardsBox.innerHTML = '<div style="color:#777; font-size:13px; text-align:center;">아직 등록된 수시지원 카드가 없습니다.</div>';
            }

            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }
        
        document.getElementById('detailModal').addEventListener('click', function(e) { if(e.target === this) closeModal('detailModal'); });
        document.getElementById('cardEditModal').addEventListener('click', function(e) { if(e.target === this) closeModal('cardEditModal'); });
        
        window.onload = fetchData;
    </script>
</body>
</html>
